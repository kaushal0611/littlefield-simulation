# Littlefield bot settings. Edit on GitHub and commit; the next run picks it up.

dry_run: false            # true = log decisions, change nothing
allow_loans: true         # borrow (20%/yr + 5% fee) to fund fast-payback capacity
stop_after_day: 299.5

# hard limits, applied after the policy
max_spend_per_run: 600000
max_buy_per_station_per_run: 8
max_sell_per_run: 3

# Slack (needs repo secret SLACK_WEBHOOK_URL)
summary_hours: 1                   # bot posts a Slack summary once per this many hours (backup: .github/workflows/slack.yml)
alert_edits_off_after_day: 50.5

# policy knobs (defaults in lf/policy.py, tuned on the digital twin)
policy:
  util_target: 1.0        # planned machine utilisation at forecast demand (tuned 9 Nov: beats 0.90 in all 6 test cases)
  flush_days: 10          # clear the day-50 backlog over ~10 days
  wip_days: 0.8           # WIP cap = throughput x 0.8 day
  max_debt: 900000        # raised 10 Nov (was 600k): room for the cash floor below
  cash_floor: 150000      # was 250k; >= one kit order (~$122k) so machine buys + kit orders stay allowed
  safety_days: 0.5        # kit safety stock (was 1.0; 0.5 tested +$10k, debt-financed kits cost 20%/yr)
  rule: pri4              # tester priority: fifo | pri2 | pri4
  sell_from_day: 230      # was 200; selling later tested +$6k
  no_edit_mode: hold      # if contract/WIP never become editable: stop buying kits, keep cash
  hold_after_day: 55
