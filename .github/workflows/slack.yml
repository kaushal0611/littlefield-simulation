name: slack-summary

on:
  schedule:
    - cron: "37 * * * *"        # hourly backup: posts only if the bot itself hasn't posted a summary for 75+ min
  workflow_dispatch:
    inputs:
      hours:
        description: "Window in hours (blank = summary_hours from config.yaml)"
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Post summary
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${{ inputs.hours }}" ]; then python scripts/slack_summary.py --hours "${{ inputs.hours }}";
          elif [ "${{ github.event_name }}" = "schedule" ]; then python scripts/slack_summary.py --if-stale 75;
          else python scripts/slack_summary.py; fi
